codecov:
  # Codecov's default branch for this repo was left at `master`, which last
  # received an upload in 2023. The README badge and repo-level totals read
  # from the default branch, so point it at `main`.
  branch: main

coverage:
  status:
    project:
      default:
        target: auto
        # Coverage used to swing by ~2% between identical runs because two
        # byzantine tests were nondeterministic (#444). Those tests now use
        # fixed inputs and seeds, so identical runs produce identical
        # coverage. Keep a small threshold for rounding and harmless drift.
        threshold: 0.5%
    patch:
      default:
        informational: true

# Do not post a coverage comment on pull requests. Coverage still
# shows up as commit statuses.
comment: false
