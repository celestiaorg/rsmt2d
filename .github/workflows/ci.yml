name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

env:
  GO_VERSION: '1.26'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      code-quality: write
    strategy:
      fail-fast: false
      matrix:
        goarch: ["amd64"]
    timeout-minutes: 5
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v7
      - uses: technote-space/get-diff-action@f27caffdd0fb9b13f4fc191c016bb4e0632844af # v6
        with:
          PATTERNS: |
            **/**.go
            go.mod
            go.sum
            .github/workflows/ci.yml
      - name: build
        run: GOOS=linux GOARCH=${{ matrix.goarch }} go build
        if: env.GIT_DIFF
      - name: test & coverage report creation
        run: |
          GOARCH=${{ matrix.goarch }} go test ./... -mod=readonly -timeout 8m -race -coverprofile=coverage.txt -covermode=atomic
        if: env.GIT_DIFF
      - uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: ./coverage.txt
        if: env.GIT_DIFF
      - name: Convert coverage to Cobertura
        run: go run github.com/boumenot/gocover-cobertura@v1.5.0 < coverage.txt > coverage.xml
        if: env.GIT_DIFF && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      - name: Upload coverage to GitHub Code Quality
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Go
          label: unit-tests-${{ matrix.goarch }}
        if: env.GIT_DIFF && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
