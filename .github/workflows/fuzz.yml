# fuzz runs each native Go fuzz target for a short, fixed budget on every PR.
# The seed corpus of every target already runs as part of `go test` in the
# Tests workflow; this job additionally lets the coverage-guided fuzzer explore
# new inputs. Run `make fuzz FUZZTIME=10m` locally for a longer campaign.
name: fuzz

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

env:
  # Deliberately ahead of the 1.26 used by ci.yml and lint.yml. Under Go 1.26 a
  # fuzz target that runs to the end of its -fuzztime budget fails with
  # "context deadline exceeded" instead of passing: when the budget expires the
  # coordinator reads the parent context's error before the worker context has
  # been cancelled, so the shutdown is not recognised as an expected
  # cancellation (https://go.dev/issue/75804). Go 1.27 widened that check.
  # Drop this override once go.mod and the other workflows move to 1.27.
  GO_VERSION: '1.27'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzRepair
          - FuzzRepairCorrupted
          - FuzzComputeAndImportExtendedDataSquare
          - FuzzUnmarshalJSON
          - FuzzLeoRSCodec
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: fuzz ${{ matrix.target }}
        run: go test -run '^$' -fuzz "^${{ matrix.target }}$" -fuzztime 60s .
